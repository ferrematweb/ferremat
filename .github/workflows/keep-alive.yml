name: keep-backend-alive

on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          echo "Pinging https://ferremat-backend.onrender.com/api/health"
          curl -fsS https://ferremat-backend.onrender.com/api/health || echo "ping failed but ignored"
          curl -fsS https://ferremat.pages.dev/ > /dev/null || true
