# Ferremat Backend — Render Blueprint
# Despliega la API + panel admin en Render (Web Service).
#
# Configuración: ve al Web Service en Render → Environment → pega las
# variables de entorno de la lista que te di (o completa los valores
# de sync: false de este archivo).
services:
  - type: web
    name: ferremat-backend
    runtime: node
    plan: free
    rootDir: backend
    healthCheckPath: /api/health
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "false"
      - key: PORT
        value: "4000"
      - key: ADMIN_USUARIO
        value: "ferrematadmin"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "8h"
      - key: SESSION_SECRET
        sync: false
      - key: MAX_UPLOAD_SIZE
        value: "5242880"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
